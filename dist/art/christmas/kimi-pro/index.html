<!doctype html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081d20">
  <title>今夜，树会跳舞 · 圣诞音乐贺卡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="heading">
      <div>
        <p class="eyebrow"><span aria-hidden="true">✦</span> A NINETEEN-SECOND CHRISTMAS</p>
        <h1>今夜，树会跳舞</h1>
      </div>
      <p class="dedication">把一小段星光<br>送给挂念的你</p>
    </header>

    <div id="stage" aria-label="一棵随着音乐起舞的圣诞树" data-section="opening">
      <canvas id="scene" role="img" aria-label="雪夜中的圣诞树、金色灯饰、礼物与星空"></canvas>
      <div class="stage-bar" aria-hidden="true">
        <span class="maker">NOËL <i></i> 19</span>
        <span id="sectionLabel" class="section-label">序章 · 初雪</span>
      </div>
      <p class="stage-wish" aria-hidden="true">May your days be<br><strong>merry &amp; bright</strong></p>
    </div>

    <section class="controls" aria-label="音乐播放控制">
      <button id="play" type="button" aria-label="播放音乐">
        <span class="play-symbol" aria-hidden="true"></span>
        <span id="playText">播放</span>
      </button>
      <div class="timeline">
        <div class="time-row">
          <span id="currentTime" class="time">0:00</span>
          <span id="movementText" class="movement">灯序缓缓亮起</span>
          <span class="time">0:19</span>
        </div>
        <input id="seek" type="range" min="0" max="19" step="0.01" value="0" aria-label="音乐进度，单位秒">
        <div class="chapter-marks" aria-hidden="true"><span>初雪</span><span>铃舞</span><span>长明</span></div>
      </div>
    </section>

    <footer class="footnote">
      <span><i class="sound-dot" aria-hidden="true"></i> 建议开启声音</span>
      <span>重拍起舞 · 铃声点灯 · 岁末长明</span>
    </footer>
    <audio id="music" preload="auto" src="../music.wav"></audio>
  </main>
  <script src="tree.js"></script>
</body>
</html>
