<!doctype html>
<html lang="zh-CN">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圣诞树的十九秒</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>圣诞树的十九秒</h1>
  <div id="stage" aria-label="圣诞树动画">
    <canvas id="scene" role="img" aria-label="随 music.wav 起舞的圣诞树：重拍驱动整棵树，铃声点亮枝头灯饰"></canvas>
  </div>
  <audio id="music" preload="auto" src="../music.wav"></audio>
  <div id="controls">
    <button id="play" type="button">播放</button>
    <label class="seek-wrap">进度
      <input id="seek" type="range" min="0" max="19" step="0.01" value="0" aria-label="进度（单位：秒）">
    </label>
    <output id="time" for="seek">0.0 / 19.0 s</output>
  </div>
  <p id="hint">重拍驱动整棵树摇摆起舞，高音铃声逐盏点亮枝头灯饰；三段式：序曲 → 加速 → 尾声。</p>
</main>
<script src="tree.js"></script>
</html>
