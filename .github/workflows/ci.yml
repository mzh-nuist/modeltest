name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Python tests (local fixtures only)
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py"
      - name: Public data boundary
        run: |
          python scripts/audit_challenge_assets.py
          python scripts/audit_checkup_assets.py
      - name: Build local Worker
        run: python scripts/build_worker.py
      - name: Check whitespace
        run: git diff --check
